<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 h-[1000px] m-0 p-0">
  <!-- Wrapper 1: Anchored to bottom -->
  <div class="fixed bottom-[72px] left-4 right-4 bg-red-500/20 border border-red-500 flex flex-col justify-end">
    
    <!-- Wrapper 2: The Card. Max height is restricted so it doesn't hit the top bar! -->
    <div id="global-setup-card" class="relative w-full flex flex-col justify-end bg-blue-500/20 max-h-[calc(100vh-150px)] min-h-0">
      
      <!-- Drawer Body: When open, it can grow, but flex-1 allows it to shrink! -->
      <!-- If it's closed, we would use max-h-0. Since it's open, flex-1 min-h-0. -->
      <div id="drawer-body" class="w-full flex flex-col z-0 -mb-6 pt-2 bg-green-500/50 flex-1 min-h-0">
        
        <div class="h-10 bg-black/50 shrink-0">Drag Handle</div>
        
        <!-- Inner Scroll Area: Absorbs the shrink and scrolls! -->
        <div class="flex-1 min-h-0 overflow-y-auto bg-yellow-500/50 p-4">
          <div class="h-[1000px] bg-white/20 text-black">TALL CONTENT (1000px)</div>
        </div>

      </div>
      
      <!-- Pill: Its height can be anything! The drawer will adjust! -->
      <div id="pill" class="relative z-10 w-full bg-purple-500 shrink-0 p-4">
        Summary Pill<br>Line 2<br>Line 3 (Wrapped)
      </div>

    </div>
  </div>
</body>
</html>
