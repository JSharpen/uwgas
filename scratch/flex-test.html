<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-900 p-4">

<div class="w-[300px] border border-red-500 p-2 mb-8">
  <p class="text-white mb-2">Desired (Machine on top):</p>
  <div class="flex flex-row-reverse flex-wrap-reverse gap-2">
    <div class="flex-auto min-w-[80px] bg-blue-500 p-2 text-center text-white">Jig</div>
    <div class="flex-auto min-w-[80px] bg-green-500 p-2 text-center text-white">USB</div>
    <div class="flex-auto min-w-[80px] bg-red-500 p-2 text-center text-white">Machine</div>
  </div>
</div>

<div class="w-[500px] border border-red-500 p-2">
  <p class="text-white mb-2">Wide (All on one row):</p>
  <div class="flex flex-row-reverse flex-wrap-reverse gap-2">
    <div class="flex-auto min-w-[80px] bg-blue-500 p-2 text-center text-white">Jig</div>
    <div class="flex-auto min-w-[80px] bg-green-500 p-2 text-center text-white">USB</div>
    <div class="flex-auto min-w-[80px] bg-red-500 p-2 text-center text-white">Machine</div>
  </div>
</div>

</body>
</html>
